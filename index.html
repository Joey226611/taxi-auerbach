<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Taxi Auerbach</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>🚕 Taxi bedrijf Auerbach</header>

<div class="container">
  <div class="card">
    <h2>Taxi reserveren</h2>

    <input id="from" placeholder="Ophaal straat">
    <input id="to" placeholder="Bestemming">
    <input id="time" type="datetime-local">

    <button onclick="reserve()">Reserveer taxi</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/visitor.js"></script>
</body>
</html>
